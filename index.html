<!DOCTYPE html>
<html>
<head>
    <title>VTU AI Study Buddy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #343541;
            margin: 0;
            padding: 0;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        h1 {
            text-align: center;
            padding: 15px;
            background-color: #202123;
            margin: 0;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            max-width: 70%;
            white-space: pre-wrap;
        }

        .user {
            background-color: #10a37f;
            margin-left: auto;
        }

        .ai {
            background-color: #444654;
            margin-right: auto;
        }

        #input-container {
            display: flex;
            padding: 15px;
            background-color: #202123;
        }

        select, input {
            padding: 10px;
            margin-right: 10px;
            border-radius: 5px;
            border: none;
        }

        input {
            flex: 1;
        }

        button {
            padding: 10px 15px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            background-color: #10a37f;
            color: white;
        }

        #clear-btn {
            background-color: crimson;
        }

        .typing {
            font-style: italic;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<h1>VTU AI Study Buddy 🤖</h1>

<div id="chat-container"></div>

<div id="input-container">
    <select id="subject">
        <option>Artificial Intelligence</option>
        <option>Machine Learning</option>
        <option>Data Science</option>
        <option>Python Programming</option>
    </select>

    <input type="text" id="question" placeholder="Ask your question..." onkeypress="if(event.key==='Enter') askAI()">
    
    <button onclick="askAI()">Send</button>
    <button id="clear-btn" onclick="clearChat()">Clear</button>
</div>

<script>
let chatHistory = [];

async function askAI() {
    const questionInput = document.getElementById("question");
    const subject = document.getElementById("subject").value;
    const question = questionInput.value;

    if (!question) return;

    const chatContainer = document.getElementById("chat-container");

    // Add user message
    addMessage(question, "user");
    chatHistory.push({role: "user", content: question});
    questionInput.value = "";

    // Add typing indicator
    const typingMessage = document.createElement("div");
    typingMessage.className = "message ai typing";
    typingMessage.innerText = "AI is typing...";
    chatContainer.appendChild(typingMessage);
    chatContainer.scrollTop = chatContainer.scrollHeight;

    try {
        const response = await fetch("http://127.0.0.1:8000/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ 
                question: "Subject: " + subject + ". Question: " + question 
            })
        });

        const data = await response.json();

        chatContainer.removeChild(typingMessage);

        addMessage(data.answer, "ai");
        chatHistory.push({role: "ai", content: data.answer});

    } catch (error) {
        chatContainer.removeChild(typingMessage);
        addMessage("Error connecting to server.", "ai");
    }
}

function addMessage(text, sender) {
    const chatContainer = document.getElementById("chat-container");
    const message = document.createElement("div");
    message.className = "message " + sender;
    message.innerText = text;
    chatContainer.appendChild(message);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function clearChat() {
    document.getElementById("chat-container").innerHTML = "";
    chatHistory = [];
}
</script>

</body>
</html>
