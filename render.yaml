services:
  - type: web
    name: vtu-genius-ai
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd Backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
